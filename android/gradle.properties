org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 opt-outs (added by the Flutter 3.50 migrator). Plugins such as
# shared_preferences_android still apply the kotlin-android plugin, which
# fails under AGP 9's built-in Kotlin. Flip both to true (and drop
# id("kotlin-android") from app/build.gradle.kts) once plugins migrate.
android.builtInKotlin=false
android.newDsl=false
